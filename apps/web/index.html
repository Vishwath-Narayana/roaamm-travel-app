<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0B0F" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="ROAAMM: meet ID-verified solo travellers on your dates, book licensed local guides by the hour, and travel with built-in safety tools."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- First hero photo (the LCP image on the landing page). -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      fetchpriority="high"
      imagesrcset="/images/hero-1-640.avif 640w, /images/hero-1-960.avif 960w, /images/hero-1-1280.avif 1280w, /images/hero-1-2048.avif 2048w"
      imagesizes="100vw"
    />
    <!-- Display font used by the hero headline (above the fold). -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="./node_modules/@fontsource-variable/inter-tight/files/inter-tight-latin-wght-normal.woff2"
    />
    <title>ROAAMM</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
