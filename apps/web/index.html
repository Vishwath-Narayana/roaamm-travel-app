<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0B0F" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="ROAAMM: meet ID-verified solo travellers on your dates, book licensed local guides by the hour, and travel with built-in safety tools."
    />
    <link rel="canonical" href="https://roaamm.plinthwell.com/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Share previews (Open Graph and Twitter / X). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ROAAMM" />
    <meta property="og:title" content="ROAAMM: Travel solo. Never alone." />
    <meta
      property="og:description"
      content="Meet ID-verified solo travellers on your dates, book licensed local guides by the hour, and travel with built-in safety tools. A portfolio project; all data is simulated."
    />
    <meta property="og:url" content="https://roaamm.plinthwell.com/" />
    <meta property="og:image" content="https://roaamm.plinthwell.com/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A hiker crossing a golden mountain meadow, with the ROAAMM wordmark and the words Travel solo. Never alone."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      First hero photo (the LCP image on the landing page), preloaded on "/" only.
      Other routes never show it, and a static preload there makes Chrome warn
      "preloaded but not used". This must stay the only inline script: its SHA-256
      is pinned for the strict CSP (docs/adr/0007-landing-only-hero-preload.md) and
      a test fails if the two drift. It sits above the stylesheet so it never waits on CSS.
    -->
    <script>
      if (location.pathname === "/") {
        const l = document.createElement("link");
        l.rel = "preload";
        l.setAttribute("as", "image");
        l.setAttribute("type", "image/avif");
        l.setAttribute("fetchpriority", "high");
        l.setAttribute("imagesrcset", "/images/hero-1-640.avif 640w, /images/hero-1-960.avif 960w, /images/hero-1-1280.avif 1280w, /images/hero-1-2048.avif 2048w");
        l.setAttribute("imagesizes", "100vw");
        document.head.appendChild(l);
      }
    </script>
    <!-- Display font used by the hero headline (above the fold). -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="./node_modules/@fontsource-variable/inter-tight/files/inter-tight-latin-wght-normal.woff2"
    />
    <title>ROAAMM</title>
  </head>
  <body>
    <noscript>
      <p style="max-width: 40rem; margin: 4rem auto; padding: 0 1rem; font: 18px/1.6 system-ui, sans-serif">
        ROAAMM needs JavaScript to run. Please turn it on, or read about the project on
        <a href="https://github.com/Vishwath-Narayana/roaamm-travel-app">GitHub</a>.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
