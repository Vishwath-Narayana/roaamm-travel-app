[package]
name = "roaamm-edge"
description = "Cloudflare Worker (Rust, WebAssembly): gateway, rate limits, Durable Objects."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roaamm-protocol = { path = "../crates/roaamm-protocol" }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
