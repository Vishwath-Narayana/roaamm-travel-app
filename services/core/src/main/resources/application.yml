spring:
  application:
    name: roaamm-core
  threads:
    virtual:
      enabled: true

server:
  # Cloud Run sets PORT; 8080 is the local default.
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
