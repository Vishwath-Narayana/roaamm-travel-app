spring:
  application:
    name: roaamm-core
  threads:
    virtual:
      enabled: true
  # spring.datasource.url/username/password come from DATABASE_URL at runtime
  # (DatabaseUrlEnvironmentPostProcessor). Never put them in this file.
  datasource:
    hikari:
      pool-name: roaamm
      # Cloud Run runs at most 2 instances; Neon's free tier has few connections.
      maximum-pool-size: 3
      minimum-idle: 0
      connection-timeout: 5000
      validation-timeout: 2000
      idle-timeout: 60000
      max-lifetime: 300000
  flyway:
    # Transaction-scoped advisory lock: safe through Neon's pooled (PgBouncer) endpoint.
    postgresql:
      transactional-lock: true

server:
  # Cloud Run sets PORT; 8080 is the local default.
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    # Flyway logs the JDBC URL (host included) at INFO.
    org.flywaydb: warn

roaamm:
  web-origin: https://roaamm.plinthwell.com
  session:
    ttl: 8h
    # Shared demo users: oldest sessions beyond this are dropped.
    max-per-demo-user: 500
  demo-rate-limit:
    # Demo session creation per client IP, per window. In memory: resets on restart.
    max-per-window: 10
    window: 10m
  # Every /v1/auth and /v1/me passkey call, per client IP.
  auth-rate-limit:
    max-per-window: 30
    window: 10m
  # Recovery codes are guessable only by brute force; keep it slow.
  recovery-rate-limit:
    max-per-window: 5
    window: 1h
  passkey:
    rp-id: roaamm.plinthwell.com
    rp-name: ROAAMM
    challenge-ttl: 5m
    # Deletes and recovery code regeneration need a passkey check this recent.
    fresh-auth-window: 5m
    # Signups pause when this many real accounts exist.
    max-real-accounts: 300
    # Real accounts with no sign-in for this long are deleted. Demo users never are.
    inactive-after: 90d
  # Simulated ID verification (docs/adr/0006-simulated-verification.md).
  verification:
    # Submissions per client IP.
    max-per-window: 10
    window: 1h
    # Shared demo users: newest visitor-made requests kept per demo user.
    max-per-demo-user: 50
    # Demo visitors' requests are deleted after this; the simulated seed rows stay.
    demo-retention: 24h
    # Rejected requests are deleted this long after the decision.
    rejected-retention: 30d
    page-size: 20
  # Trips (M4a): per user. Shared demo users keep their newest rows instead of being blocked.
  trips:
    max-per-user: 20
    demo-retention: 24h
    page-size: 20
  # Guide applications (docs/adr/0008-guide-applications.md).
  guide:
    max-per-demo-user: 20
    demo-retention: 24h
    page-size: 20
  # Per client IP on /v1/trips, /v1/guide and /v1/admin. In memory: resets on restart.
  api-rate-limit:
    read:
      max-per-window: 300
      window: 10m
    trip-write:
      max-per-window: 30
      window: 10m
    guide-apply:
      max-per-window: 5
      window: 1h
    admin-write:
      max-per-window: 60
      window: 10m
