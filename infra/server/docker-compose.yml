# Runs on the Google Cloud e2-micro. No ports are published: traffic arrives
# only through Cloudflare Tunnel (cloudflared -> http://core:8080).
services:
  core:
    image: ghcr.io/vishwath-narayana/roaamm-core:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: /etc/roaamm/core.env
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 400m
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ok <&3"]
      interval: 15s
      timeout: 5s
      retries: 5
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - core
