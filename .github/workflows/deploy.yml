name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  edge-web-status:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy web
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4 deploy
      - name: Deploy edge
        working-directory: edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4 deploy
      - name: Deploy status
        working-directory: status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4 deploy

  # Java core on Google Cloud Run (docs/adr/0003-core-hosting-cloud-run.md).
  # Off until the repository variable CORE_DEPLOY_ENABLED is set to 'true'.
  # Keyless: GitHub OIDC -> Workload Identity Federation, no service account keys.
  core:
    if: vars.CORE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    env:
      IMAGE: ${{ vars.GCP_IMAGE_REPO }}/core:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Build image (native, see services/core/Dockerfile)
        run: docker build -t "$IMAGE" services/core
      - name: Push image to Artifact Registry
        env:
          REGION: ${{ vars.GCP_REGION }}
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker push "$IMAGE"
      - name: Deploy to Cloud Run
        run: >-
          gcloud run deploy roaamm-core
          --image "$IMAGE"
          --region ${{ vars.GCP_REGION }}
          --project ${{ vars.GCP_PROJECT_ID }}
          --max-instances 2
          --min-instances 0
          --allow-unauthenticated
          --set-secrets=DATABASE_URL=neon-database-url:latest

  # roaamm-api.plinthwell.com -> Cloud Run core (docs/adr/0003-core-hosting-cloud-run.md).
  # wrangler bundles the TypeScript itself, so no install or build step.
  api-proxy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Deploy api proxy
        working-directory: edge-api-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4 deploy

  smoke:
    needs: [edge-web-status, core, api-proxy]
    if: >-
      always() && !cancelled() && (needs.edge-web-status.result == 'success'
      || needs.core.result == 'success' || needs.api-proxy.result == 'success')
    runs-on: ubuntu-latest
    env:
      EDGE_RESULT: ${{ needs.edge-web-status.result }}
      CORE_RESULT: ${{ needs.core.result }}
      API_PROXY_RESULT: ${{ needs.api-proxy.result }}
    steps:
      - name: Health checks
        run: |
          set -e
          # check URL ATTEMPTS: retry every 10 s.
          check() {
            ok=0
            for _ in $(seq 1 "$2"); do
              if curl -fsS --max-time 10 "$1" > /dev/null; then ok=1; break; fi
              sleep 10
            done
            if [ "$ok" != 1 ]; then echo "FAILED: $1"; exit 1; fi
            echo "ok: $1"
          }
          if [ "$EDGE_RESULT" = "success" ]; then
            check https://roaamm.plinthwell.com/health.json 6
            check https://roaamm-rt.plinthwell.com/health 6
            check https://roaamm-status.plinthwell.com/health.json 6
          fi
          if [ "$API_PROXY_RESULT" = "success" ] || [ "$CORE_RESULT" = "success" ]; then
            # Up to ~3 minutes: a first deploy of the custom domain waits for
            # DNS and the edge certificate.
            check https://roaamm-api.plinthwell.com/health 18
            # Database through the core. Up to ~5 minutes: a suspended Neon
            # compute and a cold Cloud Run instance both have to wake up.
            check https://roaamm-api.plinthwell.com/ready 30
          fi
