name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  edge-web-status:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy web
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4 deploy
      - name: Deploy edge
        working-directory: edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4 deploy
      - name: Deploy status
        working-directory: status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4 deploy

  core:
    if: vars.CORE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.1.0"
      - name: Native build
        working-directory: services/core
        run: gradle nativeCompile -PjavaVersion=25
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: services/core
          push: true
          tags: |
            ghcr.io/vishwath-narayana/roaamm-core:${{ github.sha }}
            ghcr.io/vishwath-narayana/roaamm-core:latest
      - name: Deploy over Cloudflare Access SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          install -m 600 /dev/null key
          printf '%s\n' "$SSH_KEY" > key
          ssh -i key \
            -o StrictHostKeyChecking=accept-new \
            -o "ProxyCommand=./cloudflared access ssh --hostname $SSH_HOST --id $CF_ACCESS_CLIENT_ID --secret $CF_ACCESS_CLIENT_SECRET" \
            "$SSH_USER@$SSH_HOST" "/opt/roaamm/deploy.sh $IMAGE_TAG"

  smoke:
    needs: [edge-web-status, core]
    if: always() && !cancelled() && (needs.edge-web-status.result == 'success' || needs.core.result == 'success')
    runs-on: ubuntu-latest
    env:
      EDGE_RESULT: ${{ needs.edge-web-status.result }}
      CORE_RESULT: ${{ needs.core.result }}
    steps:
      - name: Health checks
        run: |
          set -e
          urls=""
          if [ "$EDGE_RESULT" = "success" ]; then
            urls="https://roaamm.plinthwell.com/health.json https://roaamm-rt.plinthwell.com/health https://roaamm-status.plinthwell.com/health.json"
          fi
          if [ "$CORE_RESULT" = "success" ]; then
            urls="$urls https://roaamm-api.plinthwell.com/health"
          fi
          for url in $urls; do
            ok=0
            for _ in 1 2 3 4 5 6; do
              if curl -fsS --max-time 10 "$url" > /dev/null; then ok=1; break; fi
              sleep 10
            done
            if [ "$ok" != 1 ]; then echo "FAILED: $url"; exit 1; fi
            echo "ok: $url"
          done
