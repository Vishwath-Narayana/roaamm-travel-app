name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Hash built web assets (used by the "verify this build" page)
        run: |
          cd apps/web/dist
          find . -type f ! -name '*.map' | sort | xargs sha256sum > ../../../asset-hashes.txt
          cat ../../../asset-hashes.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" asset-hashes.txt --generate-notes --title "$GITHUB_REF_NAME"
