name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      workflows: ${{ steps.filter.outputs.workflows }}
      web: ${{ steps.filter.outputs.web }}
      rust: ${{ steps.filter.outputs.rust }}
      core: ${{ steps.filter.outputs.core }}
      api-proxy: ${{ steps.filter.outputs.api-proxy }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            workflows:
              - '.github/**'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'scripts/**'
            rust:
              - 'edge/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - 'rust-toolchain.toml'
            core:
              - 'services/core/**'
              - 'scripts/ci/core-native-smoke.sh'
              - 'scripts/ci/passkey-smoke.mjs'
              - 'scripts/ci/verification-smoke.mjs'
            api-proxy:
              - 'edge-api-proxy/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  lint-workflows:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:latest -color

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Bundle size budget
        run: node scripts/check-bundle-size.mjs apps/web/dist 250
      - name: Lighthouse (performance >= 0.9, accessibility >= 0.95)
        run: pnpm dlx @lhci/cli@0.14 autorun --config=apps/web/lighthouserc.json
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: WebAssembly builds
        run: |
          cargo check -p roaamm-edge --target wasm32-unknown-unknown --release
          cargo check -p roaamm-crypto --target wasm32-unknown-unknown --release
      - uses: EmbarkStudios/cargo-deny-action@v2

  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
      # Also validates the checked-in Gradle wrapper jar.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew check
      # Build only, never pushed: proves the native image and Dockerfile work.
      - name: Docker build (native image, no push)
        run: docker build -t roaamm-core:ci .
      # The native binary against a throwaway Postgres: proves the driver,
      # Flyway migrations and JDBC all work in the native image. No secrets.
      - name: Native container against Postgres
        working-directory: .
        run: scripts/ci/core-native-smoke.sh roaamm-core:ci

  api-proxy:
    needs: changes
    if: needs.changes.outputs.api-proxy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @roaamm/api-proxy typecheck
      - run: pnpm --filter @roaamm/api-proxy test
      # Bundles and validates wrangler.toml without a token or an upload.
      - name: wrangler dry run
        working-directory: edge-api-proxy
        run: pnpm dlx wrangler@4 deploy --dry-run --outdir dist

  ci-ok:
    # The single required status check for branch protection.
    if: always()
    needs: [changes, lint-workflows, secrets, web, rust, core, api-proxy]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*) echo "a required job failed"; exit 1 ;;
          esac
